<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juntô Doces</title>
<meta name="description" content="Cardápio digital da Juntô Doces. Monte seu açaí, peça pelo site e acompanhe pelo WhatsApp.">
<meta name="theme-color" content="#fbf0f7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Yellowtail&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 24 24"><path d="M12 21 4.2 13.2C1.6 10.6 1.9 6.6 4.7 4.8c2.3-1.4 5-.7 6.6 1.3L12 7l.7-.9c1.6-2 4.3-2.7 6.6-1.3 2.8 1.8 3.1 5.8.5 8.4z"/></symbol>
  <symbol id="whisk" viewBox="0 0 61 80">
    <rect x="26" y="1" width="9" height="25" rx="4.5" fill="var(--wood)"/>
    <rect x="25" y="24" width="11" height="6" rx="2" fill="currentColor"/>
    <g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
      <path d="M30.5 30C8 40 8 66 30.5 76 53 66 53 40 30.5 30Z"/>
      <path d="M30.5 30C20 42 20 64 30.5 76"/>
      <path d="M30.5 30C41 42 41 64 30.5 76"/>
      <path d="M30.5 30V76"/>
    </g>
  </symbol>
</svg>

<div class="wrap">
  <main>
    <section id="v-cardapio" hidden></section>
    <section id="v-finalizar" class="narrow" hidden></section>
    <section id="v-acompanhar" class="narrow" hidden></section>
  </main>
  <footer>
    <div class="tag">Doce em cada detalhe! <svg class="heart" aria-hidden="true"><use href="#heart"/></svg></div>
    <small id="fcats">Açaí</small>
    <small>Guaíba · <a href="https://www.instagram.com/juntodoces_" target="_blank" rel="noopener">@juntodoces_</a></small>
    <small><a href="admin.html">Área da loja</a></small>
  </footer>
</div>

<div class="bagbar" id="bagbar" hidden>
  <button type="button" id="openBag" aria-haspopup="dialog">
    <span id="bagCount">Sacola</span><span id="bagTotal"></span>
  </button>
</div>
<div class="sheetbg" id="sheetbg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Sua sacola" hidden></div>
<div class="modalbg" id="mbg" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Detalhes do produto" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
